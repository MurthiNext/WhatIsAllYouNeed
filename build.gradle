plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def nextUi = "com.murthinext:nextui-forge-${minecraft_version}:${nextui_version}".toString()
def nextUiRange = "[${nextui_version},${nextui_version_limit})".toString()
def nextUiMavenUrl = providers.gradleProperty('nextui_maven_url').orNull

jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    if (nextUiMavenUrl) {
        maven {
            url = uri(nextUiMavenUrl)
            content {
                includeModule 'com.murthinext', "nextui-forge-${minecraft_version}"
            }
        }
    }
    mavenLocal {
        content {
            includeModule 'com.murthinext', "nextui-forge-${minecraft_version}"
        }
    }
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mekanism'
        }
    }
    maven {
        name = 'CoFH Maven'
        url = 'https://maven.covers1624.net'
        content {
            includeGroup 'com.teamcofh'
        }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'FirstDarkDev Maven'
        url = 'https://maven.firstdarkdev.xyz/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf(nextUi)
    jarJar(nextUi) {
        jarJar.ranged(it, nextUiRange)
    }

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "com.mojang:logging:1.1.1"
    compileOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")
    compileOnly fg.deobf("com.teamcofh:cofh_core:${cofh_core_version}")
    compileOnly fg.deobf("com.teamcofh:thermal_core:${thermal_core_version}")
    compileOnly fg.deobf("curse.maven:industrial-foregoing-266515:${industrial_foregoing_file}")
    compileOnly fg.deobf("maven.modrinth:titanium:${titanium_version}")
    compileOnly fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}")
    compileOnly fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}")
}

sourceSets.main.resources.srcDir('src/generated/resources')

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             nextui_version_range   : nextUiRange,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}
